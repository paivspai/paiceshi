<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0e">
<title>派总电商利润监控表 · 邮箱授权登录</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#090a0e;color:#f2f5f7}
*{box-sizing:border-box}body{margin:0;min-height:100vh}
.page{max-width:520px;margin:0 auto;padding:clamp(40px,9vh,90px) 20px 48px}
.brand{color:#47d6a5;letter-spacing:.19em;font-size:12px;font-weight:700;margin-bottom:18px}
h1{font-size:clamp(27px,6vw,35px);margin:0 0 12px}p{color:#a8b6bf;line-height:1.75;font-size:14px;margin:0 0 24px}
.panel{border:1px solid #2a3743;background:linear-gradient(145deg,#161d27,#10151c);border-radius:18px;padding:24px}
label{display:block;font-size:13px;color:#b5c3cc;margin:16px 0 9px}
input{width:100%;background:#0a1118;border:1px solid #3a4958;border-radius:11px;padding:14px;font-size:17px;color:#fff;outline:none}
input:focus{border-color:#47d6a5}
button{background:#27c990;border:0;color:#062018;font-weight:800;font-size:15px;border-radius:11px;padding:14px 20px;cursor:pointer;width:100%;margin-top:18px}
button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#263442;color:#ecf3f5}
.notice{font-size:13px;min-height:20px;margin-top:14px;line-height:1.7;color:#ffce8f}
.hint{font-size:12px;color:#93a6b1;margin-top:20px;line-height:1.75}
.hidden{display:none!important}.workspace{max-width:1400px;margin:auto;padding:10px}
.bar{position:sticky;top:0;z-index:2;background:#111820;border:1px solid #2a3743;border-radius:12px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:10px;font-size:13px;color:#b9c7d0}
.bar button{margin:0;width:auto;padding:9px 15px;font-size:12px}.bar strong{color:#47d6a5}
iframe{display:block;width:100%;border:0;min-height:650px;background:#090a0e}
</style>
</head><body>
<main class="page" id="login">
  <div class="brand">PAI COMMERCE / AUTHORIZED ACCESS</div>
  <h1>派总电商利润监控表</h1>
  <p>工作台仅向授权用户开放。已获得使用资格的用户，请使用报白邮箱验证后进入。</p>
  <section class="panel">
    <div id="emailForm">
      <label for="email">授权邮箱</label>
      <input id="email" autocomplete="email" type="email" inputmode="email" placeholder="请输入报白邮箱">
      <button id="send" type="button">发送邮箱登录邮件</button>
    </div>
    <div id="codeForm" class="hidden">
      <label for="code">邮箱验证码</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="如邮件含验证码，请在此输入">
      <button type="button" id="verify">验证并进入</button>
      <button class="secondary" id="resend" type="button">重新发送邮件</button>
    </div>
    <div class="notice" id="message" role="status" aria-live="polite"></div>
    <div class="hint">如收到的是登录链接，请点击邮件中的链接。只有已经报白的邮箱才能进入工作台；能收到验证邮件不代表已经授权。</div>
  </section>
</main>
<section class="workspace hidden" id="workspace">
  <div class="bar"><span>已授权：<strong id="userEmail"></strong></span><button type="button" class="secondary" id="logout">退出登录</button></div>
  <iframe title="派总电商利润监控表" id="app" referrerpolicy="no-referrer"></iframe>
</section>
<script>
(()=>{
"use strict";
const API="https://rsiqtfaudqfdhckjovse.supabase.co";
const KEY="sb_publishable_2a9ay2duBlIDb_DXyyORfg_l8wnEYGn";
const SESSION="pai_profit_auth_session_v1";
const $=id=>document.getElementById(id);
let session=null,locked=false;
const msg=(message,error=false)=>{$("message").textContent=message;$("message").style.color=error?"#ff7c8a":"#ffce8f";};
const headers=()=>({"apikey":KEY,"Content-Type":"application/json"});
const save=()=>{try{localStorage.setItem(SESSION,JSON.stringify(session));}catch(e){}};
const clear=()=>{session=null;try{localStorage.removeItem(SESSION);}catch(e){}};
async function call(url,options={}){
 const res=await fetch(url,options);
 const data=await res.json().catch(()=>({}));
 if(!res.ok)throw new Error(data.msg||data.message||data.error_description||data.error||"服务暂不可用");
 return data;
}
async function freshToken(){
 if(!session?.access_token)throw new Error("请先验证邮箱");
 if(Date.now()<(session.expires_at_ms||0)-60000)return session.access_token;
 if(!session.refresh_token)throw new Error("登录已失效，请重新验证邮箱");
 const data=await call(API+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:headers(),body:JSON.stringify({refresh_token:session.refresh_token})});
 session={...data,expires_at_ms:Date.now()+(data.expires_in||3600)*1000};save();return session.access_token;
}
async function enter(){
 if(locked)return;
 locked=true;msg("正在校验使用权限...");
 try{
   const token=await freshToken();
   const d=await call(API+"/functions/v1/profit-workbench-access",{headers:{"apikey":KEY,"Authorization":"Bearer "+token}});
   if(d.authorized!==true||typeof d.html!=="string")throw new Error("授权验证失败");
   $("userEmail").textContent=d.email||"";
   $("workspace").classList.remove("hidden");$("login").classList.add("hidden");
   const frame=$("app");
   frame.onload=()=>{try{
     const resize=()=>{frame.style.height=Math.max(650,frame.contentDocument.documentElement.scrollHeight+18)+"px";};
     resize();new ResizeObserver(resize).observe(frame.contentDocument.body);
   }catch(e){}};
   frame.srcdoc=d.html;msg("");
 }catch(e){
   $("workspace").classList.add("hidden");$("login").classList.remove("hidden");
   const reasons={not_approved:"该邮箱尚未报白，请联系派总开通使用资格。",email_not_verified:"请先完成邮箱验证。",session_invalid:"登录已失效，请重新登录。",Invalid_JWT:"登录已失效，请重新登录。"};
   msg(reasons[e.message]||e.message,true);
   if(["session_invalid","Invalid_JWT"].includes(e.message))clear();
 }finally{locked=false;}
}
async function send(){
 const email=$("email").value.trim().toLowerCase();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg("请输入正确的邮箱地址",true);return;}
 $("send").disabled=true;$("resend").disabled=true;msg("正在发送邮件...");
 try{
   const redirect=location.origin+location.pathname;
   await call(API+"/auth/v1/otp?redirect_to="+encodeURIComponent(redirect),{method:"POST",headers:headers(),body:JSON.stringify({email,create_user:true})});
   $("codeForm").classList.remove("hidden");msg("邮件已发送。请输入验证码，或点击邮件中的登录链接。");
 }catch(e){msg(e.message,true);}
 finally{$("send").disabled=false;$("resend").disabled=false;}
}
async function verify(){
 const email=$("email").value.trim().toLowerCase(),token=$("code").value.trim();
 if(!token){msg("请输入邮件中的验证码",true);return;}
 $("verify").disabled=true;msg("正在验证...");
 try{
   const d=await call(API+"/auth/v1/verify",{method:"POST",headers:headers(),body:JSON.stringify({email,token,type:"email"})});
   session={...d,expires_at_ms:Date.now()+(d.expires_in||3600)*1000};save();await enter();
 }catch(e){msg(e.message,true);}
 finally{$("verify").disabled=false;}
}
$("send").onclick=send;$("verify").onclick=verify;$("resend").onclick=send;
$("logout").onclick=async()=>{
 const previous=session;clear();$("workspace").classList.add("hidden");$("login").classList.remove("hidden");$("app").removeAttribute("srcdoc");msg("已退出登录。");
 if(previous?.access_token)fetch(API+"/auth/v1/logout",{method:"POST",headers:{...headers(),"Authorization":"Bearer "+previous.access_token}}).catch(()=>{});
};
(async()=>{
 const hash=new URLSearchParams(location.hash.slice(1));
 if(hash.get("access_token")){
   session={access_token:hash.get("access_token"),refresh_token:hash.get("refresh_token"),expires_at_ms:Date.now()+(Number(hash.get("expires_in"))||3600)*1000};
   save();history.replaceState(null,"",location.pathname+location.search);
 }else{try{session=JSON.parse(localStorage.getItem(SESSION)||"null");}catch(e){clear();}}
 if(session?.access_token)await enter();
})();
})();
</script>
</body></html>
